<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${appName}">BookKOK</title>
    <link rel="stylesheet" href="/css/bookkok.css">
</head>
<body>
<!--
    흐름 1) 사용자가 /login, /home, /board 같은 URL로 접근하면
    Spring ViewController가 이 index.html을 내려줌.

    이 파일은 화면 전체의 공통 껍데기 역할.
    실제 로그인/예약/게시판 화면 내용은 아래 <main id="app"> 안에
    JavaScript가 현재 URL에 맞게 동적으로 넣는 방식.
-->
<div class="site-shell">
    <header class="top-header">
        <a class="logo" href="/home" aria-label="BookKOK 홈">
        	<img src="images/BookKok_logo.webp" alt="예약콕">
        </a>
        <div id="authArea"></div>
    </header>
    <nav class="main-nav">
        <a href="/reservations">시설 예약</a>
        <a href="/clubs">단체 관리</a>
        <a href="/board">게시판</a>
        <a href="/mypage" onclick="return requireLogin();">마이페이지</a>
        <a class="admin-only" href="/admin">관리자</a>
    </nav>
    <!--
        흐름 2) 각 화면 JS(auth.js, reservation.js 등)의 render 함수들이
        app.js의 setApp() 함수를 통해 이 영역의 innerHTML 교체.

        예: /login 접근
        index.html 로드 -> router.js의 boot() 실행 -> renderLogin() 호출
        -> auth.js의 renderLogin()이 이 #app 영역에 로그인 화면 넣기.
    -->
    <main id="app" class="page-content"></main>
</div>

<div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
        <button class="modal-close" type="button" id="modalClose">x</button>
        <div class="modal-icon">!</div>
        <p id="modalMessage">로그인이 필요합니다.</p>
        <button class="primary small" type="button" id="modalOk">확인</button>
    </div>
</div>

<!--
    흐름 3) app.js를 가장 먼저 로드.

    app.js는 모든 화면에서 공통으로 쓰는 전역 변수와 함수 준비 담당.
    예: app, modal, state, api(), setApp(), isLoggedIn(), requireLogin()
-->
<script src="/js/bookkok/app.js"></script>
<!--
    흐름 4) 화면별 render 함수를 먼저 로드.

    아래 파일들은 renderLogin(), renderBoard(), renderReservationStep1() 같은
    화면 렌더링 함수를 전역에 등록.
    router.js가 이 함수들을 호출해야 하므로 router.js보다 먼저 로드 필요.
-->
<script src="/js/bookkok/pages/auth/auth.js"></script>
<script src="/js/bookkok/pages/home.js"></script>
<script src="/js/bookkok/pages/reservation/reservation.js"></script>
<script src="/js/bookkok/pages/club/club.js"></script>
<script src="/js/bookkok/pages/board/board.js"></script>
<script src="/js/bookkok/pages/mypage/mypage.js"></script>
<script src="/js/bookkok/pages/admin/admin.js"></script>
<!--
    흐름 5) router.js를 마지막에 로드.

    router.js는 현재 URL(location.pathname)을 확인하고
    routes 배열에서 매칭되는 render 함수 실행.

    예: 현재 URL이 /board면
    router.js -> boot() -> routes에서 /board 매칭 -> renderBoard() 실행
    -> board.js가 #app에 게시판 목록 화면 그리기.
-->
<script src="/js/bookkok/router.js"></script>
</body>
</html>
